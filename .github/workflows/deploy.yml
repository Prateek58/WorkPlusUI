name: Deploy Frontend to CloudPanel

on:
  push:
    branches:
      - main # Change this if your default branch is 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SITE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22 # Default SSH port
          script: |
            # Load the site user's Node/NVM environment
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # Navigate to site root and pull code
            cd ~/htdocs/workplus.layerbiz.com
            git pull origin main
            
            # Navigate into the frontend subdirectory
            cd workplus-ui
            
            # Install and build
            npm install
            npm run build
            
            # Restart PM2
            pm2 restart layerbiz-workplus